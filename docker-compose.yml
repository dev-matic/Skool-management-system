# Local development database only. Production setup is documented separately.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skool
      POSTGRES_PASSWORD: skool_dev_password
      POSTGRES_DB: skool_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skool -d skool_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
